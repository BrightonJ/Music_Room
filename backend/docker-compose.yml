services:
  db:
    image: postgres:15
    container_name: music_room_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?copy backend/.env.example to backend/.env first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy backend/.env.example to backend/.env first}
      POSTGRES_DB: ${POSTGRES_DB:?copy backend/.env.example to backend/.env first}
    ports:
      # Only reachable from this machine: the API is the single entry point
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: {}
